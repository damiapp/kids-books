name: Build

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repo ships only lib/ + pubspec.yaml, so generate the Android
      # project files. --platforms=android keeps it minimal and skips the
      # files that already exist (your lib/ and pubspec.yaml are untouched).
      # --org + --project-name set the Android applicationId: app.peekado.
      - run: flutter create --platforms=android --org app --project-name peekado .

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: peekado-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Compile check only — see README §1d. Without an Apple Developer
  # account there's nothing to sign with, and an unsigned .app can't be
  # installed on a phone. It still catches iOS-only breakage (pods,
  # deployment targets, a plugin with no iOS implementation) early.
  # macOS runners are billed at 10x, but this repo is public, so the
  # minutes are free.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms=ios --org app --project-name peekado .

      - run: python3 .github/scripts/ios_deployment_target.py

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: peekado-ios-unsigned
          path: build/ios/iphoneos/Runner.app
