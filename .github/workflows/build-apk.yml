name: Build APK

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lifted to job level so the steps below can test whether signing is
      # configured — the `secrets` context isn't available in a step `if`.
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repo ships only lib/ + pubspec.yaml, so generate the Android
      # project files. --platforms=android keeps it minimal and skips the
      # files that already exist (your lib/ and pubspec.yaml are untouched).
      # --org + --project-name set the Android applicationId: app.peekado.
      - run: flutter create --platforms=android --org app --project-name peekado .

      # Flutter's generated project signs release builds with the *debug*
      # key, and a fresh runner has no debug keystore — so Gradle invents a
      # new random one every run. That gives every APK a different
      # signature, and Android rejects an install over an app signed by a
      # different key. Point the release build at a real, stable keystore
      # instead. See README §1d for the one-time setup.
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          set -euo pipefail

          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          # flutter create rewrites the Gradle files on every run, so the
          # signing config has to be re-injected here rather than committed.
          python3 - <<'PY'
          import pathlib, sys

          app = pathlib.Path('android/app')
          kts, groovy = app / 'build.gradle.kts', app / 'build.gradle'

          if kts.exists():
              path, kotlin = kts, True
          elif groovy.exists():
              path, kotlin = groovy, False
          else:
              sys.exit('no android/app/build.gradle(.kts) found to patch')

          src = path.read_text()

          if kotlin:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  '        }\n'
                  '    }\n\n'
              )
              old = 'signingConfig = signingConfigs.getByName("debug")'
              new = 'signingConfig = signingConfigs.getByName("release")'
          else:
              header = (
                  'def keystoreProperties = new Properties()\n'
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              signing = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile file(keystoreProperties['storeFile'])\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  '        }\n'
                  '    }\n\n'
              )
              old = 'signingConfig signingConfigs.debug'
              new = 'signingConfig signingConfigs.release'

          # Fail loudly rather than quietly shipping a debug-signed APK.
          if old not in src:
              sys.exit('release signingConfig line not found — Flutter template changed')
          marker = '    buildTypes {'
          if marker not in src:
              sys.exit('buildTypes block not found — Flutter template changed')

          src = header + src.replace(old, new)
          src = src.replace(marker, signing + marker, 1)
          path.write_text(src)
          print('patched', path)
          PY

      - name: Warn that builds are unsigned
        if: env.ANDROID_KEYSTORE_B64 == ''
        run: |
          echo "::warning::No ANDROID_KEYSTORE_B64 secret — this APK is signed with a" \
               "throwaway debug key and will NOT install over an existing Peekado." \
               "See README §1d."

      - run: flutter pub get

      - run: flutter build apk --release

      # Print the signing certificate so a mismatch is obvious here rather
      # than as a failed install on the phone.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: peekado-apk
          path: build/app/outputs/flutter-apk/app-release.apk
