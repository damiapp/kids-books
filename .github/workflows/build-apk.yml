name: Build APK

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # A step-level `if` can't read the `secrets` context, so the key is
    # lifted to a job-level env var that steps are allowed to test.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Not secrets: these are the stock Android debug values, and the
      # keystore file is the thing worth protecting. Gradle reads them at
      # build time (see .github/scripts/patch_signing.py).
      PEEKADOO_STORE_PASSWORD: android
      PEEKADOO_KEY_ALIAS: androiddebugkey
      PEEKADOO_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repo ships only lib/ + pubspec.yaml, so generate the Android
      # project files. --platforms=android keeps it minimal and skips the
      # files that already exist (your lib/ and pubspec.yaml are untouched).
      # --org + --project-name set the Android applicationId: app.peekadoo,
      # which has to match the package name registered in Firebase (§1c) —
      # App Check and API key restrictions check it.
      - run: flutter create --platforms=android --org app --project-name peekadoo .

      - run: flutter pub get

      # Both of these rewrite files inside the generated android/ folder,
      # so they run after `flutter create` and before the build — and on
      # every run, because that folder is thrown away each time.
      - run: dart run flutter_launcher_icons

      - run: python3 .github/scripts/patch_app_label.py

      # Flutter's template signs release builds with signingConfigs.debug,
      # and a runner regenerates that keystore on every run — which is why
      # every APK carried a different signature and Android refused to
      # install one over another. The patch gives the project a real
      # release signingConfig instead of relying on where the toolchain
      # thinks the debug keystore lives. See README §1d.
      - name: Sign with the release key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          keystore="$RUNNER_TEMP/peekadoo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "PEEKADOO_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          PEEKADOO_KEYSTORE="$keystore" python3 .github/scripts/patch_signing.py

      - name: Warn that this build won't install as an update
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK gets a throwaway signature and will not install over an existing Peekadoo. See README section 1d."

      - run: flutter build apk --release

      # Who actually signed it. This is a gate, not a log line: signing
      # silently falling back to the debug key is precisely the bug this
      # whole section exists to fix, and it is invisible until an install
      # fails on a phone days later.
      - name: Check the signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found on this runner; cannot verify the signature."
            exit 0
          fi
          certs=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs" | grep -Ei 'certificate DN|SHA-256 digest' || true
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::Signed with the stock debug certificate despite a keystore being provided — this APK will not install as an update."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: peekadoo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
