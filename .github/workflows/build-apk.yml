name: Build APK

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repo ships only lib/ + pubspec.yaml, so generate the Android
      # project files. --platforms=android keeps it minimal and skips the
      # files that already exist (your lib/ and pubspec.yaml are untouched).
      - run: flutter create --platforms=android --org rs.stasa --project-name kids_books .

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kids-books-apk
          path: build/app/outputs/flutter-apk/app-release.apk
