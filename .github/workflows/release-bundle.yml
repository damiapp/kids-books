name: Release bundle

# The build that goes to Google Play. Run it by hand from the Actions tab
# (Release bundle → Run workflow) when a version is ready to upload.
#
# It differs from build-apk.yml in three ways, all on purpose:
#   * an App Bundle (.aab), which Play requires for new apps, not an APK;
#   * demo accounts compiled out (lib/config.dart, kDemoAccounts);
#   * it refuses to run without the signing key — an unsigned or
#     debug-signed bundle can never be uploaded, so failing early is
#     kinder than producing one.
# The other steps mirror build-apk.yml; a change to one usually belongs
# in both.

on:
  workflow_dispatch:
    inputs:
      payments_live:
        description: "Real payments (only once RevenueCat + Play Billing are connected)"
        type: boolean
        default: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PEEKADOO_STORE_PASSWORD: android
      PEEKADOO_KEY_ALIAS: androiddebugkey
      PEEKADOO_KEY_PASSWORD: android
    steps:
      - name: Require the signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A bundle for Google Play must be signed with the release key (README section 1d)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms=android --org app --project-name peekadoo .

      - run: flutter pub get

      - run: flutter test

      - run: dart run flutter_launcher_icons

      - run: python3 .github/scripts/patch_app_label.py

      - run: python3 .github/scripts/patch_crashlytics.py

      - name: Sign with the release key
        run: |
          keystore="$RUNNER_TEMP/peekadoo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "PEEKADOO_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          PEEKADOO_KEYSTORE="$keystore" python3 .github/scripts/patch_signing.py

      - name: Build the App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=DEMO_ACCOUNTS=false \
            --dart-define=PAYMENTS_LIVE=${{ inputs.payments_live }}

      # Bundles are JAR-signed, so keytool can read the certificate
      # straight out of one. Same gate as the APK build: a bundle signed
      # by anything but the release key is refused rather than uploaded.
      - name: Check the signing certificate
        run: |
          certs=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$certs" | grep -E 'Owner:|SHA256:' || true
          if ! echo "$certs" | grep -q 'CN=Peekadoo'; then
            echo "::error::The bundle is not signed with the Peekadoo release key."
            exit 1
          fi

      # Same gate as the APK build: without this ID the Crashlytics SDK
      # throws at startup. A bundle keeps its resource table as protobuf,
      # whose names are plain UTF-8, so grep can find it.
      - name: Check the Crashlytics build ID
        run: |
          if ! unzip -p build/app/outputs/bundle/release/app-release.aab base/resources.pb \
               | grep -a -q 'com.google.firebase.crashlytics.mapping_file_id'; then
            echo "::error::No Crashlytics build ID in the bundle — the app would crash on launch."
            exit 1
          fi
          echo "Crashlytics build ID present."

      - uses: actions/upload-artifact@v4
        with:
          name: peekadoo-aab
          path: build/app/outputs/bundle/release/app-release.aab
