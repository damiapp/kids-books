name: peekadoo
description: Peekadoo — short listen-and-tap lessons for preschoolers. Free energy refills over time; All Access removes the cap.
publish_to: "none"
# Still pre-release. Convention while in dev: bump PATCH for small fixes,
# MINOR when a roadmap phase ships (see README), and always bump the build
# number (+N, after the +) on every push — that's what makes each APK
# install as an update on a phone instead of needing an uninstall first.
version: 0.13.1+33

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2      # used only by the demo entitlement store

  # Sign-in (landing → onboarding → login flow). See lib/firebase_options.dart.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0

  # Google Play Billing, wrapped by RevenueCat (handles the All Access
  # subscription, restore, and entitlements). The app runs in demo mode
  # until you switch main.dart over to the RevenueCat service.
  purchases_flutter: ^8.0.0

  # Read-aloud narration in the reader — device TTS, fully offline.
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # When you replace emoji placeholders with real art:
  # assets:
  #   - assets/books/
